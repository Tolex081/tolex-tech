    <!-- Fonts are self-hosted (Bodoni Moda + Schibsted Grotesk via @fontsource),
         bundled with the CSS — no third-party font request. -->

    <!-- Applies the visitor's stored mode before first paint, so nobody sees a
         flash of the wrong light while React boots. Light is the default. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("theme-mode");
          if (mode !== "dark" && mode !== "light") mode = "light";
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(mode);
          root.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#0d1422" : "#eaf1f8");
        } catch (e) {
          /* storage blocked — the default class on <html> already applies */
        }
      })();
    </script>
