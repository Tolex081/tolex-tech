    <!-- Fonts moved out of index.css: an @import there chains an extra
         round-trip behind the stylesheet before any text can paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- Applies the stored theme before first paint, otherwise every visitor
         sees a flash of the default theme while React boots. -->
    <script>
      (function () {
        try {
          var modes = ["dark", "light"];
          var themes = ["teal", "purple", "amber"];
          var mode = localStorage.getItem("theme-mode");
          var color = localStorage.getItem("color-theme");

          if (modes.indexOf(mode) === -1) {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (themes.indexOf(color) === -1) color = "teal";

          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.remove("theme-teal", "theme-purple", "theme-amber");
          root.classList.add(mode, "theme-" + color);
          root.style.colorScheme = mode;
        } catch (e) {
          /* storage blocked — the default classes on <html> already apply */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
